<!-- 2048 小游戏 · Ethereal 主题专用自定义页面内容（仅前台模式，域名无关）
     用法：Halo 后台 → 页面 → 新建 → HTML / 源码模式整段粘贴
           → 页面设置里把「别名 / slug」填为 game2048 → 发布
     访问：https://你的域名/game2048（「你的域名」= 站点自身域名，无需任何配置）
     插件不注册 Console 菜单、也不注册前台导航项，这里是唯一入口。
     片段只含同源相对路径，不含固定域名、绝对 URL 与脚本；任意域名通用。
     标题与说明沿用主题排版；卡片与游戏页内部跟随主题明暗、色相。
     若 Halo 部署在子路径（如 /blog），把下方两处 /plugins/ 前缀改为 /blog/plugins/。 -->
<section style="max-width:920px;margin:0 auto;padding:8px 0 24px">
  <h2 style="margin:0 0 8px;font-size:28px;line-height:1.3">2048 小游戏</h2>
  <p style="margin:0 0 18px;font-size:14px;line-height:1.8;opacity:.8">
    合并相同数字，冲上 2048。支持方向键 / WASD 与触屏滑动，可撤销一步，成绩进入站点排行榜。
  </p>

  <div style="padding:8px;border-radius:var(--radius-large,1rem);background:var(--card-bg,#fff);border:1px solid color-mix(in oklab,var(--primary,#7c6cf0) 16%,transparent);box-shadow:0 6px 24px -16px rgba(0,0,0,.25)">
    <iframe
      src="/plugins/plugin-game-2048/assets/game/index.html"
      data-game2048
      title="2048 小游戏"
      loading="lazy"
      style="display:block;width:100%;height:clamp(720px,92vh,900px);border:0;border-radius:12px"></iframe>
  </div>

  <p style="margin:12px 0 0;font-size:13px;line-height:1.7;opacity:.75">
    点击游戏区域后使用方向键 / WASD 操作；手机直接滑动棋盘。
    <a href="/plugins/plugin-game-2048/assets/game/index.html" target="_blank" rel="noopener">新窗口全屏打开 ↗</a>
  </p>
</section>
