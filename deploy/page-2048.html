<!-- 2048 小游戏 · 自定义页面完整内容（域名无关，可直接粘贴到任何 Halo 站点）
     用法：Halo 后台 → 页面 → 新建 → 切换到 HTML / 源码模式，整段粘贴 → 发布。
     别名 / slug 填 game2048，发布后访问 https://你的域名/game2048。
     「你的域名」= 安装本插件的站点自身域名；片段内不含任何固定域名或绝对 URL，
     安装到哪个域名就自动用哪个域名，无需改文件、无需重新打包。
     当前形态不往导航加菜单项，这里就是唯一入口。
     纯 HTML + 内联样式，无脚本，即使编辑器过滤 <script> 也能正常显示。
     若 Halo 部署在子路径（如 /blog），把下方两处 /plugins/ 前缀改为 /blog/plugins/。
     自适应视口：iframe 高度按父视口剩余空间计算，游戏页棋盘同步缩放；浏览器保持 100% 缩放即可直接玩，无需缩小网页。
-->
<section style="max-width:920px;margin:0 auto;padding:4px 0 12px">
  <h2 style="margin:0 0 6px;font-size:clamp(20px,2.4vw,26px);line-height:1.3">2048 小游戏</h2>
  <p style="margin:0 0 8px;font-size:14px;line-height:1.6;opacity:.8">
    合并相同数字，冲上 2048。支持方向键 / WASD 与触屏滑动，可撤销一步，成绩会进入站点排行榜。
  </p>

  <iframe
    src="/plugins/plugin-game-2048/assets/game/index.html"
    title="2048 小游戏"
    loading="lazy"
    style="display:block;width:100%;height:clamp(420px,calc(100vh - 150px),860px);height:clamp(420px,calc(100dvh - 150px),860px);border:0;border-radius:12px;background:#faf8ef"></iframe>

  <p style="margin:8px 0 0;font-size:13px;line-height:1.7;opacity:.75">
    点击游戏区域后使用方向键 / WASD 操作；手机直接滑动棋盘。
    <a href="/plugins/plugin-game-2048/assets/game/index.html" target="_blank" rel="noopener">新窗口全屏打开 ↗</a>
  </p>
</section>
