# Automatically add the game to the site's primary navigation menu.
#
# Halo 2.26+ resolves menu hierarchy through spec.menuName; the default primary
# menu is named "primary" (confirmed on mlingxi.cn via the theme's rendered
# "menu":"primary" config). The link is same-origin, so it is compatible with
# the site's X-Frame-Options: SAMEORIGIN and needs no absolute URL.
#
# status is written explicitly as a safety net: themes read
# status.displayName / status.href rather than spec.*. If the built-in
# reconciler recomputes it, the result is identical.
#
# Halo removes preset resources when the plugin stops, so the entry
# disappears cleanly when the plugin is disabled.
apiVersion: v1alpha1
kind: MenuItem
metadata:
  name: plugin-game-2048-nav
spec:
  displayName: 2048 小游戏
  href: /plugins/plugin-game-2048/assets/game/index.html
  menuName: primary
  priority: 0
status:
  displayName: 2048 小游戏
  href: /plugins/plugin-game-2048/assets/game/index.html
