# The public leaderboard API is intentionally read/create only and aggregated
# to the anonymous role so the standalone front-end page works for visitors.
# Write/delete access to the underlying GameScore extension is never public.
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-game-2048-role-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  - apiGroups: ["api.game2048.halo.run"]
    resources: ["scores"]
    verbs: ["get", "list", "create"]

---
# Optional role template for administrators who need to manage stored scores.
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-game-2048-role-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "2048 小游戏"
    rbac.authorization.halo.run/display-name: "2048 排行榜管理"
rules:
  - apiGroups: ["game2048.halo.run"]
    resources: ["gamescores"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["api.game2048.halo.run"]
    resources: ["scores"]
    verbs: ["get", "list", "create"]
