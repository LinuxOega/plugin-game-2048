plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'run.halo.game2048.ui'

// Use the Node/npm already installed on the machine instead of downloading one.
node {
    download = false
}

tasks.register('buildFrontend', NpmTask) {
    group = 'build'
    description = 'Builds the Console UI with Vite.'
    args = ['run', 'build']
    dependsOn tasks.named('npmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
            dir: layout.projectDirectory,
            includes: ['*.ts', '*.js', '*.json', '*.html']))
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('npmCheck', NpmTask) {
    group = 'verification'
    description = 'Runs the 2048 core unit tests with Node.'
    args = ['test']
    dependsOn tasks.named('npmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('npmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('buildFrontend')
}
